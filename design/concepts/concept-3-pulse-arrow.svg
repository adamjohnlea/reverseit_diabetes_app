<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AA9FF"/>
      <stop offset="1" stop-color="#1466E0"/>
    </linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a2f6b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg3)"/>
  <!-- ECG-style pulse line -->
  <path d="M120,512 h150 l60,-150 l90,300 l70,-120 h120"
        fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" filter="url(#sh3)"/>
  <!-- bold downward arrow (bringing numbers down) -->
  <g filter="url(#sh3)">
    <path d="M760,300 v300" fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round"/>
    <path d="M760,640 l -96,-108 M760,640 l 96,-108"
          fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
