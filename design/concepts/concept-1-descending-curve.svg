<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#0E9F8E"/>
    </linearGradient>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#004b3f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg1)"/>
  <!-- faint gridlines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="3">
    <line x1="120" y1="300" x2="904" y2="300"/>
    <line x1="120" y1="470" x2="904" y2="470"/>
    <line x1="120" y1="640" x2="904" y2="640"/>
    <line x1="120" y1="810" x2="904" y2="810"/>
  </g>
  <!-- rise then descend curve -->
  <path d="M120,560 C 250,560 300,330 450,330 C 610,330 620,730 840,760"
        fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" filter="url(#sh1)"/>
  <!-- arrowhead pointing down-right at end -->
  <path d="M840,760 l -12,-92 M840,760 l -86,-30"
        fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#sh1)"/>
  <!-- glucose droplet marker at the peak -->
  <circle cx="450" cy="330" r="34" fill="#ffffff"/>
  <circle cx="450" cy="330" r="15" fill="#0E9F8E"/>
</svg>
